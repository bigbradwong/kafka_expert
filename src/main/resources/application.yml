server:
  port: 8080
  error:
    include-message: always

spring:
  # Kafka 集群配置
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}

  # H2 磁盘数据库配置
  datasource:
    url: jdbc:h2:file:./data/offsetdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  
  # 开启 H2 Web 管理界面
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

logging:
  level:
    com.example: INFO
    org.springframework.jdbc: DEBUG
